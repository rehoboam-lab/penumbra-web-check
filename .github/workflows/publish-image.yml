# Publish the patched fork as its own container image so the Render service
# can point at ghcr.io/rehoboam-lab/penumbra-web-check instead of the
# vendored upstream image (activation step for the stability patches — see
# PENUMBRA_PATCHES.md).
name: Publish image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rehoboam-lab/penumbra-web-check:latest
            ghcr.io/rehoboam-lab/penumbra-web-check:${{ github.sha }}
